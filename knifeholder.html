<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>طلب علاقة سكاكين عصرية</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900">

  <!-- Header -->
  <header class="bg-white shadow-md fixed w-full z-50">
    <div class="max-w-7xl mx-auto flex justify-between items-center py-4 px-6">
      <a href="index.html">
        <img src="images/products/wall.png" alt="شعار" class="h-12 rounded-full shadow">
      </a>
      <h1 class="text-xl font-bold">طلب علاقة سكاكين عصرية</h1>
    </div>
  </header>

  <!-- Form Section -->
  <main class="pt-28 pb-20 px-6">
    <div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-lg p-8">

      <!-- Product -->
      <div class="text-center mb-8">
        <img src="images/pic1.jpg" alt="علاقة سكاكين عصرية" class="mx-auto rounded-xl shadow mb-4">
        <h2 class="text-2xl font-bold mb-2" id="productName">علاقة سكاكين عصرية</h2>
        <p class="text-gray-600">السعر: <span id="unitPrice" data-price="1500">1500</span> دج للقطعة الواحدة</p>
        <p class="text-sm text-gray-500">خصم 100 دج لكل قطعة إضافية</p>
      </div>

      <!-- Order Form -->
      <form id="orderForm" class="space-y-6" data-product-name="علاقة سكاكين عصرية" data-unit-price="1500">
        <div>
          <label class="block mb-2 font-semibold">الاسم واللقب</label>
          <input type="text" name="fullname" required class="w-full border rounded-lg p-3 focus:ring focus:ring-green-200">
        </div>

        <div>
          <label class="block mb-2 font-semibold">الولاية</label>
          <select name="wilaya" required class="w-full border rounded-lg p-3">
            <option value="">اختر الولاية</option>
            <!-- جميع الولايات -->
            <option>أدرار</option>
            <option>الشلف</option>
            <option>الأغواط</option>
            <option>أم البواقي</option>
            <option>باتنة</option>
            <option>بجاية</option>
            <option>بسكرة</option>
            <option>بشار</option>
            <option>البليدة</option>
            <option>البويرة</option>
            <option>تمنراست</option>
            <option>تبسة</option>
            <option>تلمسان</option>
            <option>تيارت</option>
            <option>تيزي وزو</option>
            <option>الجزائر</option>
            <option>الجلفة</option>
            <option>جيجل</option>
            <option>سطيف</option>
            <option>سعيدة</option>
            <option>سكيكدة</option>
            <option>سيدي بلعباس</option>
            <option>عنابة</option>
            <option>قالمة</option>
            <option>قسنطينة</option>
            <option>المدية</option>
            <option>مستغانم</option>
            <option>المسيلة</option>
            <option>معسكر</option>
            <option>ورقلة</option>
            <option>وهران</option>
            <option>البيض</option>
            <option>إليزي</option>
            <option>برج بوعريريج</option>
            <option>بومرداس</option>
            <option>الطارف</option>
            <option>تندوف</option>
            <option>تيسمسيلت</option>
            <option>الوادي</option>
            <option>خنشلة</option>
            <option>سوق أهراس</option>
            <option>تيبازة</option>
            <option>ميلة</option>
            <option>عين الدفلى</option>
            <option>النعامة</option>
            <option>عين تموشنت</option>
            <option>غرداية</option>
            <option>غليزان</option>
            <option>تيميمون</option>
            <option>برج باجي مختار</option>
            <option>أولاد جلال</option>
            <option>بني عباس</option>
            <option>إن صالح</option>
            <option>إن قزام</option>
            <option>تقرت</option>
            <option>جانت</option>
            <option>المغير</option>
            <option>المنيعة</option>
          </select>
        </div>

        <div>
          <label class="block mb-2 font-semibold">البلدية</label>
          <input type="text" name="baladiya" required class="w-full border rounded-lg p-3">
        </div>

        <div>
          <label class="block mb-2 font-semibold">العنوان</label>
          <textarea name="address" rows="2" required class="w-full border rounded-lg p-3"></textarea>
        </div>

        <div>
          <label class="block mb-2 font-semibold">رقم الهاتف</label>
          <input type="tel" name="phone" required class="w-full border rounded-lg p-3">
        </div>

        <div>
          <label class="block mb-2 font-semibold">الكمية</label>
          <input type="number" name="quantity" id="quantity" value="1" min="1" class="w-full border rounded-lg p-3">
        </div>

        <div>
          <p class="font-bold text-lg">السعر الإجمالي: <span id="totalPrice">1500</span> دج</p>
        </div>

        <button type="submit" class="w-full bg-green-600 text-white py-3 rounded-lg hover:bg-green-700 transition">إرسال الطلب</button>
      </form>
    </div>
  </main>

  <!-- ربط JS مركزي -->
  <script src="js/sendOrder.js"></script>

</body>
</html>
