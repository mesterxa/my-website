<script>
  const qtyInput = document.getElementById("quantity");
  const totalPriceEl = document.getElementById("totalPrice");

  function updatePrice() {
    let qty = parseInt(qtyInput.value) || 1;
    let total = (qty === 1) ? 1990 : (1990 + (qty - 1) * 1000);
    totalPriceEl.textContent = total;
  }

  qtyInput.addEventListener("input", updatePrice);
  updatePrice();

  document.getElementById("orderForm").addEventListener("submit", function (e) {
    e.preventDefault();

    const form = new FormData(this);
    const message = `
🛒 طلب جديد - علاقة سكاكين
👤 الاسم: ${form.get("fullname")}
📍 الولاية: ${form.get("wilaya")}
🏘️ البلدية: ${form.get("baladiya")}
🏠 العنوان: ${form.get("address")}
📞 الهاتف: ${form.get("phone")}
🔢 الكمية: ${form.get("quantity")}
💰 السعر الإجمالي: ${totalPriceEl.textContent} دج
`;

    const token = " 8176513159:AAHIOJEdKK0KN9xUwgHJV4em11VkzZcXz5I  ";
    const chatId = "6858411980";

    fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ chat_id: chatId, text: message }),
    })
      .then(() => {
        alert("✅ تم إرسال الطلب بنجاح");
        this.reset();
        updatePrice();
      })
      .catch(() => {
        alert("❌ حدث خطأ، حاول مجدداً");
      });
  });
</script>
